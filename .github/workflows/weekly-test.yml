
name: Ultrafast BE — Weekly Diff Test

on:
  workflow_dispatch:   # handmatig starten

permissions:
  contents: write

jobs:
  weekly-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run weekly diff test (force post)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RANGE_DAYS: "7"             # je kunt dit aanpassen
        run: |
          python scripts/weekly_diff_test.py

      - name: Commit baseline/snapshot if created
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshot_prev.json data/changelog.log || true
          git commit -m "Save snapshot baseline (weekly test)" || echo "No changes"
          git push
