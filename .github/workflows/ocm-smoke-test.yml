
name: OCM SMOKE TEST

on:
  workflow_dispatch:  # run manually

jobs:
  ocm-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        auth_mode: [header, query]   # test both API key styles
    steps:
      - name: Call OCM API (mode = ${{ matrix.auth_mode }})
        env:
          OCM_KEY: ${{ secrets.OCM_KEY }}
          UA: "BE-Ultrafast-Openings-Bot/1.0 (GitHub Actions smoke test)"
        run: |
          set -euo pipefail
          BASE="https://api.openchargemap.io/v3/poi/"
          PARAMS="output=json&countrycode=BE&maxresults=5"

          if [ "${{ matrix.auth_mode }}" = "header" ]; then
            echo ">>> HEADER auth"
            RESP="$(curl -sS -i -X GET "${BASE}?${PARAMS}" \
              -H "User-Agent: ${UA}" -H "Accept: application/json" -H "X-API-Key: ${OCM_KEY}")"
          else
            echo ">>> QUERY-PARAM auth"
            RESP="$(curl -sS -i -X GET "${BASE}?${PARAMS}&key=${OCM_KEY}" \
              -H "User-Agent: ${UA}" -H "Accept: application/json")"
          fi

          STATUS_LINE="$(printf '%s' "$RESP" | head -n 1)"
          HEADERS="$(printf '%s' "$RESP" | awk 'NR>1{print} /^\r?$/{exit}')"
          BODY="$(printf '%s' "$RESP" | awk 'found{print} /^(\r)?$/{found=1}')"

          echo "----- STATUS -----"
          echo "$STATUS_LINE"
          echo "----- HEADERS -----"
          echo "$HEADERS"
          echo "----- BODY (first 800 chars) -----"
          printf '%s' "$BODY" | head -c 800; echo
          echo "-------------------"

          CODE="$(echo "$STATUS_LINE" | awk '{print $2}')"
          test "$CODE" = "200" || { echo "❌ Non-200: $CODE"; exit 3; }
