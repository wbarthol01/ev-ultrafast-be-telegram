
name: Telegram SMOKE TEST

on:
  workflow_dispatch:       # run manually from Actions tab

jobs:
  send_test_message:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram smoke test via Bot API
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "Sending Telegram SMOKE TEST..."
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"Hello 👋 from GitHub Actions (SMOKE TEST)\",\"parse_mode\":\"HTML\"}" \
            | tee /tmp/tg_response.json
          echo "Telegram response:"
          cat /tmp/tg_response.json
