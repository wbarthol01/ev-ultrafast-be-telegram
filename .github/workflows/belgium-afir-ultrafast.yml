
name: Belgium AFIR ultrafast -> Telegram

on:
  workflow_dispatch:        # handmatig starten
  schedule:
    - cron: "0 */6 * * *"   # elke 6 uur (UTC); throttle netjes (fair-use)

jobs:
  afir-to-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node (ES modules)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Post ultrafast (≥150 kW) from AFIR dataset
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AFIR_RESOURCE_URL: ${{ secrets.AFIR_RESOURCE_URL }}
          DAYS_BACK: "30"            # laatste X dagen (openingen/updates)
          LIMIT_POSTS: "20"          # veiligheidslimiet
        run: |
          cat > script.mjs <<'JS'
          import fetch from "node-fetch";

          const TG_TOKEN = process.env.TELEGRAM_TOKEN;
          const TG_CHAT  = process.env.TELEGRAM_CHAT_ID;
          const AFIR_URL = process.env.AFIR_RESOURCE_URL;
          const DAYS     = Number(process.env.DAYS_BACK || "30");
          const LIMIT    = Number(process.env.LIMIT_POSTS || "20");

          if (!AFIR_URL) {
            throw new Error("AFIR_RESOURCE_URL secret ontbreekt. Plak hier de directe JSON resource-URL van de AFIR-dataset.");
          }

          // === Heuristieken voor velden: de AFIR JSON kan verschillende kolomnamen gebruiken per publicatie ===
          // We proberen generiek te lezen: operator, vermogen (kW), coördinaten, connector-type/standaard, datums.
          function pick(obj, keys) {
            for (const k of keys) { if (obj?.[k] != null) return obj[k]; }
            return null;
          }
          function toNumber(v) { const n = Number(v); return Number.isFinite(n) ? n : null; }
          function isDC(candidate) {
            const s = String(candidate || "").toUpperCase();
            return s.includes("DC") || s.includes("CCS") || s.includes("CHADEMO") || s.includes("COMBO");
          }
          function bandTag(kw) {
            if (kw == null) return "AC/DC";
            if (kw >= 400) return "400+ kW";
            if (kw >= 200) return "200–399 kW";
            if (kw >= 150) return "150–199 kW";
            if (kw >= 50)  return "50–149 kW";
            return "<50 kW";
          }

          async function sendTelegram(text) {
            const url = `https://api.telegram.org/bot${TG_TOKEN}/sendMessage`;
            const payload = { chat_id: TG_CHAT, text, parse_mode: "HTML", disable_web_page_preview: false };
            const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
            const body = await r.text();
            console.log("Telegram status:", r.status);
            console.log("Telegram response:", body);
            if (!r.ok) throw new Error(`Telegram sendMessage failed: ${r.status} ${body}`);
          }

          (async () => {
            // 1) Haal AFIR JSON binnen
            const res = await fetch(AFIR_URL, { headers: { "Accept": "application/json" }});
            const ctype = (res.headers.get("content-type") || "").toLowerCase();
            if (!res.ok) throw new Error(`AFIR ${res.status} ${await res.text()}`);
            if (!ctype.includes("application/json")) throw new Error(`AFIR non-JSON content-type: ${ctype}`);

            const raw = await res.json();
            // Sommige publicaties leveren {records:[...]}, andere direct een array:
            const rows = Array.isArray(raw) ? raw
                       : Array.isArray(raw?.records) ? raw.records
                       : Array.isArray(raw?.results) ? raw.results
                       : Array.isArray(raw?.data)    ? raw.data
                       : [];

            if (!rows.length) {
              console.log("AFIR: geen records gevonden in resource.");
              return;
            }
            console.log("AFIR records:", rows.length);

            // 2) Filter laatste X dagen + ultrafast DC
            const since = new Date(Date.now() - DAYS*24*60*60*1000);
            const MIN_KW = 150;

            const candidates = [];
            for (const r of rows) {
              // Mogelijke veldnamen (varianten):
              const lat = toNumber(pick(r, ["lat","latitude","Latitude","LAT","geo_point_2d_lat","y","Y"]));
              const lon = toNumber(pick(r, ["lon","longitude","Longitude","LON","geo_point_2d_lon","x","X"]));
              if (lat == null || lon == null) continue;

              const operator = pick(r, ["operator","operator_name","cpo","brand","Brand","Operator"]) || "Operator";
              const powerKw  = toNumber(pick(r, ["power","p_max_kw","max_power_kw","PowerKW","kw","rated_power_kw"]));
              const connStd  = pick(r, ["connector_standard","connector","socket","socket_type","Connector","ConnectorType"]);
              const connType = pick(r, ["connector_type","plug_type","CurrentType","current_type"]);
              const title    = pick(r, ["location_name","site","address","Address","title","name"]) || "";
              const town     = pick(r, ["commune","gemeente","city","City","town","Town"]) || "Belgium";

              // Datumveld (update/creatie):
              const dateStr  = pick(r, ["date","updated_at","last_update","modified","DateLastStatusUpdate","DateCreated"]);
              const refDate  = dateStr ? new Date(dateStr) : null;
              if (refDate && refDate < since) continue;

              // DC + vermogen ≥ 150 kW (heuristiek)
              const isDcFlag = isDC(connStd) || isDC(connType);
              const meetsKw  = powerKw != null && powerKw >= MIN_KW;
              if (!(isDcFlag || meetsKw)) continue;

              candidates.push({ operator, powerKw, connStd, connType, lat, lon, title, town, dateStr });
            }

            console.log(`Ultrafast candidates (last ${DAYS} days):`, candidates.length);
            if (!candidates.length) {
              console.log("Geen recente ultrafast matches in AFIR.");
              return;
            }

            // 3) Dedupe per (operator + afgeronde coörd.)
            const seen = new Set();
            const msgs = [];
            for (const st of candidates) {
              const key = `${st.operator}-${st.lat.toFixed(4)}-${st.lon.toFixed(4)}`;
              if (seen.has(key)) continue; seen.add(key);

              const band = bandTag(st.powerKw);
              const title = `[${st.operator} • ${band}] ${st.town} — New/updated (last ${DAYS} days)`;
              const map = `https://www.openstreetmap.org/?mlat=${st.lat}&mlon=${st.lon}#map=16/${st.lat}/${st.lon}`;

              const lines = [
                "🚗⚡ <b>" + title + "</b>",
                st.title || "(location)",
                st.powerKw ? `Power: up to <b>${st.powerKw} kW</b> ${isDC(st.connStd)||isDC(st.connType) ? "DC" : ""}` : `Connector: ${st.connStd || st.connType || "n/a"}`,
                `Operator: ${st.operator}`,
                st.dateStr ? `Updated/Created: ${st.dateStr}` : null,
                `View Larger Map: ${map}`,
                `Source: AFIR dataset (transportdata.be)`
              ].filter(Boolean);
              msgs.push(lines.join("\n"));
            }

            // 4) Post naar Telegram
            console.log("Posting count:", Math.min(msgs.length, LIMIT));
            for (const m of msgs.slice(0, LIMIT)) {
              await sendTelegram(m);
              await new Promise(r => setTimeout(r, 400)); // mini delay
            }
          })().catch(e => { console.error(e); process.exit(1); });
          JS

          echo '{"name":"be-afir-ultrafast","version":"1.0.0","type":"module"}' > package.json
          npm i node-fetch >/dev/null 2>&1
          node script.mjs
