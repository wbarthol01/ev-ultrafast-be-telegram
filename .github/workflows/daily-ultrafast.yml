
name: Daily Ultrafast BE Summary (Road feed)

on:
  schedule:
    - cron: "0 10 * * *"   # zomertijd -> 12:00 Europe/Brussels
    - cron: "0 11 * * *"   # wintertijd -> 12:00 Europe/Brussels
  workflow_dispatch:

permissions:
  contents: write   # nodig om state-bestanden terug te committen

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate & post daily summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/daily_ultrafast_summary.py

      - name: Commit state & changelog (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshot_prev.json data/last_daily_post_date.txt data/changelog.log || true
          git commit -m "Update snapshot & daily post mark" || echo "No changes"
          git push
