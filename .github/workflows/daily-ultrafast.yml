
name: Daily Ultrafast BE Summary (Road feed)

on:
  schedule:
    - cron: "0 10 * * *"   # zomertijd -> 12:00 lokale tijd
    - cron: "0 11 * * *"   # wintertijd -> 12:00 lokale tijd
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install requests
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/daily_ultrafast_summary.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshot_prev.json data/last_daily_post_date.txt data/changelog.log
          git commit -m "Update snapshot & daily post mark" || echo "No changes"
          git push
