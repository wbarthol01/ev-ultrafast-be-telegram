
name: BE ultrafast last 30 days -> Telegram (test)

on:
  workflow_dispatch:       # handmatig starten vanuit Actions tab

jobs:
  post_last_month:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node (ESM)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run last-30-days poster
        env:
          OCM_KEY: ${{ secrets.OCM_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat > script.mjs <<'JS'
          import fetch from "node-fetch";

          const OCM_KEY = process.env.OCM_KEY;
          const TELEGRAM_TOKEN = process.env.TELEGRAM_TOKEN;
          const TELEGRAM_CHAT_ID = process.env.TELEGRAM_CHAT_ID;

          // --- Config ---
          const MIN_KW = 150;                 // ultrafast drempel
          const MAX_RESULTS = 1000;           // ruimer voor test
          const DAYS_BACK = 30;               // venster laatste maand
          const LIMIT_POSTS = 20;             // veiligheidslimiet
          const USER_AGENT = "BE-Ultrafast-Test/1.0 (GitHub Actions)"; // fair-use identificatie

          // --- Helpers ---
          const isUltrafastDC = (conn) => {
            const kw = conn.PowerKW || conn.RatedPowerKW || 0;
            const isDC = (conn.CurrentType?.Description || "").toLowerCase().includes("dc");
            return isDC && kw >= MIN_KW;
          };
          const bandTag = (kw) => kw >= 400 ? "400+ kW" : kw >= 200 ? "200–399 kW" : "150–199 kW";

          const isoNow = new Date();
          const since = new Date(isoNow.getTime() - DAYS_BACK*24*60*60*1000);

          function withinWindow(poi) {
            const created = poi.DateCreated ? new Date(poi.DateCreated) : null;
            const updated = poi.DateLastStatusUpdate ? new Date(poi.DateLastStatusUpdate) : null;
            // neem updated als primair; val terug op created
            const ref = updated || created;
            return ref && ref >= since;
          }

          async function sendTelegram(text) {
            const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`;
            const payload = { chat_id: TELEGRAM_CHAT_ID, text, parse_mode: "HTML", disable_web_page_preview: false };
            const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
            const body = await r.text();
            console.log("Telegram status:", r.status);
            console.log("Telegram response:", body);
            if (!r.ok) throw new Error(`Telegram sendMessage failed: ${r.status} ${body}`);
          }

          (async () => {
            // OCM: gebruik HEADER auth (X-API-Key); je kan ook ?key=… gebruiken
            // API docs en fair-use: https://www.openchargemap.org/develop/api
            const endpoint = `https://api.openchargemap.io/v3/poi/?output=json&countrycode=BE&maxresults=${MAX_RESULTS}`;
            const res = await fetch(endpoint, { headers: { "User-Agent": USER_AGENT, "Accept": "application/json", "X-API-Key": OCM_KEY } });

            const ctype = (res.headers.get("content-type") || "").toLowerCase();
            if (!res.ok) {
              const err = await res.text();
              console.error("OCM error status:", res.status);
              console.error("OCM error body:", err);
              throw new Error(`OCM request failed: ${res.status} ${err}`);
            }
            if (!ctype.includes("application/json")) {
              const err = await res.text();
              console.error("OCM non-JSON body:", err);
              throw new Error(`OCM non-JSON response: ${err}`);
            }

            const data = await res.json();
            console.log("OCM total results:", data.length);

            // Filter: ultrafast DC, operationeel, en binnen DATE-venster (laatste 30 dagen)
            let cand = data.filter(d => (d.Connections||[]).some(isUltrafastDC) && d.StatusType?.IsOperational && withinWindow(d));
            console.log(`Ultrafast candidates in last ${DAYS_BACK} days:`, cand.length);

            if (!cand.length) {
              console.log("Geen matches in de laatste maand — niets te posten.");
              return;
            }

            // Dedupe: operator + afgeronde coördinaten
            const seen = new Set();
            const msgs = [];
            for (const st of cand) {
              const op  = st.OperatorInfo?.Title || "EV Operator";
              const lat = st.AddressInfo?.Latitude?.toFixed(4);
              const lon = st.AddressInfo?.Longitude?.toFixed(4);
              const key = `${lat},${lon}-${op}`;
              if (seen.has(key)) continue;
              seen.add(key);

              const connectors = (st.Connections||[]).filter(isUltrafastDC);
              if (!connectors.length) continue;

              const maxKw = Math.max(...connectors.map(c => c.PowerKW || 0));
              const band  = bandTag(maxKw);
              const city  = st.AddressInfo?.Town || "Belgium";
              const site  = st.AddressInfo?.Title || "";
              const title = `[${op} • ${band}] ${city} — New ultrafast site (last 30 days)`;

              // OSM “View Larger Map”
              const mapView = `https://www.openstreetmap.org/?mlat=${st.AddressInfo?.Latitude}&mlon=${st.AddressInfo?.Longitude}#map=16/${st.AddressInfo?.Latitude}/${st.AddressInfo?.Longitude}`;

              const when = st.DateLastStatusUpdate || st.DateCreated || "";
              const msg = [
                "🚗⚡ <b>" + title + "</b>",
                `${site}, ${city}, Belgium`,
                `Power: up to <b>${maxKw} kW</b> DC`,
                `Operator: ${op}`,
                `Updated/Created: ${when}`,
                `View Larger Map: ${mapView}`,
                `Source: Open Charge Map`
              ].join("\n");

              msgs.push(msg);
            }

            // Post beperkte set (veiligheidslimiet)
            console.log("Posting count:", Math.min(msgs.length, LIMIT_POSTS));
            for (const m of msgs.slice(0, LIMIT_POSTS)) {
              await sendTelegram(m);
              // mini delay om rate limit te vermijden
              await new Promise(r => setTimeout(r, 500));
            }
          })().catch(e => { console.error(e); process.exit(1); });
          JS

          echo '{"name":"ev-ultrafast-last-month","version":"1.0.0","type":"module"}' > package.json
          npm i node-fetch >/dev/null 2>&1
          node script.mjs
